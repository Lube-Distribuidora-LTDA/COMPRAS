<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Central Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A1A; --bg2:#0A1130; --veil:rgba(8,13,36,.72);
    --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.075); --surface3:rgba(255,255,255,.11);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
    --ink:#EEF1FF; --ink2:#AEB6DA; --muted:#8A93BB;
    --blue:#5B7BFF; --blue2:#8AA0FF; --red:#FF4D57; --gold:#D9B678;
    --good:#3FD08A; --good-soft:rgba(63,208,138,.14);
    --warn:#EDB753; --warn-soft:rgba(237,183,83,.14);
    --crit:#FF4D57; --crit-soft:rgba(255,77,87,.14);
    --muted-soft:rgba(138,147,187,.16);
    --shadow:0 30px 70px -40px rgba(0,0,0,.9);
    --grid:rgba(255,255,255,.09);
  }
  :root[data-theme="light"]{
    --bg:#EFF1F7; --bg2:#FFFFFF; --veil:rgba(255,255,255,.75);
    --surface:#FFFFFF; --surface2:#F4F6FC; --surface3:#E7EAF5;
    --line:rgba(12,20,60,.11); --line2:rgba(12,20,60,.22);
    --ink:#0B1233; --ink2:#3C4570; --muted:#6B7499;
    --blue:#1B2A8C; --blue2:#3F53C4; --red:#D3121C; --gold:#A4801F;
    --good:#0E8F58; --good-soft:rgba(14,143,88,.12);
    --warn:#8F6205; --warn-soft:rgba(143,98,5,.12);
    --crit:#D3121C; --crit-soft:rgba(211,18,28,.10);
    --muted-soft:rgba(107,116,153,.12);
    --shadow:0 20px 44px -30px rgba(12,20,60,.45);
    --grid:rgba(12,20,60,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(1200px 620px at 78% -8%, color-mix(in oklch, var(--blue) 26%, transparent), transparent 70%),
      radial-gradient(900px 480px at 2% 0%, color-mix(in oklch, var(--red) 12%, transparent), transparent 68%);
    color:var(--ink); font-family:Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--blue);color:#fff;}
  .num{font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; font-weight:600;}
  h1,h2,h3{font-family:"Bricolage Grotesque", sans-serif; margin:0; text-wrap:balance;}
  @keyframes lubeRise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes lubePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.82);}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .wrap{max-width:1720px; margin:0 auto; padding:0 clamp(16px,2.4vw,34px) 56px;}

  header{position:sticky; top:0; z-index:40; backdrop-filter:blur(18px); background:var(--veil); border-bottom:1px solid var(--line);}
  .header-top{max-width:1720px; margin:0 auto; padding:14px clamp(16px,2.4vw,34px); display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:16px;}
  .logo-badge{background:#fff; border-radius:12px; padding:9px 13px; box-shadow:0 10px 26px -14px rgba(0,0,0,.55); display:flex; align-items:center;}
  .logo-badge img{height:30px; width:auto; display:block;}
  .brand-div{width:1px; height:38px; background:linear-gradient(180deg,transparent,var(--line2),transparent);}
  .brand-eyebrow{font:700 10px/1 Barlow; letter-spacing:.2em; text-transform:uppercase; color:var(--gold);}
  .brand-title{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:19px; letter-spacing:-.01em; margin-top:5px;}
  .header-actions{margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .sync-pill{display:flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--line); border-radius:100px; background:var(--surface);}
  .pulse-dot{width:7px; height:7px; border-radius:50%; background:var(--good); animation:lubePulse 2.6s ease-in-out infinite; display:inline-block;}
  .sync-pill .txt{font-size:12px; color:var(--ink2);}
  .sync-pill strong{color:var(--ink); font-family:"JetBrains Mono",monospace; font-weight:500;}
  .source-badge{padding:6px 12px; border-radius:100px; border:1px dashed var(--gold); font:700 10.5px/1.6 Barlow; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); white-space:nowrap;}
  .theme-toggle{display:flex; border:1px solid var(--line); border-radius:100px; overflow:hidden; background:var(--surface);}
  .theme-toggle button{border:0; cursor:pointer; font:600 12px Barlow; padding:7px 14px; background:transparent; color:var(--ink2);}
  .theme-toggle button.active{background:var(--blue); color:#fff;}

  nav.tabs{max-width:1720px; margin:0 auto; padding:0 clamp(16px,2.4vw,34px); display:flex; gap:2px; flex-wrap:wrap;}
  nav.tabs button{border:0; background:transparent; cursor:pointer; padding:11px 14px 13px; display:flex; align-items:center; gap:8px; border-bottom:2px solid transparent; color:var(--muted); font:600 13px Barlow;}
  nav.tabs button .tnum{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--muted);}
  nav.tabs button.active{color:var(--ink); border-bottom-color:var(--blue);}
  nav.tabs button.active .tnum{color:var(--blue);}
  nav.tabs button:not(.active):hover{color:var(--ink);}

  main{padding-top:26px; display:flex; flex-direction:column; gap:20px;}
  .pagina{display:none; flex-direction:column; gap:20px;}
  .pagina.ativa{display:flex; animation:lubeRise .45s ease both;}
  .module-eyebrow{font:700 10.5px/1 Barlow; letter-spacing:.2em; text-transform:uppercase; color:var(--gold);}
  .module-title-row{margin-top:8px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;}
  .module-title{margin:0; font-size:clamp(22px,2.4vw,30px); font-weight:700; letter-spacing:-.02em;}
  .module-info{margin-bottom:2px;}
  .module-info summary{cursor:pointer; list-style:none; font:700 10.5px Barlow; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); white-space:nowrap; transition:color .15s ease;}
  .module-info summary::-webkit-details-marker{display:none;}
  .module-info summary::before{content:"ⓘ "; font-size:11px;}
  .module-info summary:hover, .module-info[open] summary{color:var(--gold);}
  .module-desc{margin:9px 0 0; max-width:86ch; font-size:13.5px; color:var(--ink2); line-height:1.6;}
  .module-desc strong{color:var(--ink);}

  .filters{border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;}
  .filter-group{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .filter-label{font:700 10px Barlow; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);}
  .chip{cursor:pointer; border:1px solid var(--line); background:var(--surface2); color:var(--ink2); font:600 12px Barlow; padding:6px 12px; border-radius:100px; white-space:nowrap; transition:background .15s,color .15s,border-color .15s,transform .15s;}
  .chip:hover{border-color:var(--line2); transform:translateY(-1px);}
  .chip:active{transform:scale(.94);}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .chip.tone-crit.on{background:var(--crit); border-color:var(--crit); color:#fff;}
  .chip.tone-warn.on{background:var(--warn); border-color:var(--warn); color:#241900;}
  .chip.tone-good.on{background:var(--good); border-color:var(--good); color:#04170e;}
  .search-block{margin-left:auto; display:flex; gap:8px; align-items:center; flex:1 1 240px; min-width:200px;}
  .search-block input{flex:1 1 auto; min-width:0; padding:9px 13px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); font:400 13px Barlow; outline:none;}
  .search-block input:focus{border-color:var(--blue);}
  .clear-btn{cursor:pointer; border:1px solid var(--line); background:var(--surface2); color:var(--ink2); font:600 12px Barlow; padding:9px 13px; border-radius:10px; white-space:nowrap;}
  .clear-btn:hover{color:var(--ink); border-color:var(--line2);}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:12px;}
  .kpi{position:relative; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:var(--shadow); padding:15px 17px 14px; display:flex; flex-direction:column; gap:6px; transition:transform .2s cubic-bezier(.22,1,.36,1), border-color .2s ease, background .2s ease;}
  .kpi:hover{transform:translateY(-3px); border-color:var(--line2); background:var(--surface2);}
  .kpi.mudou{animation:kpiPulso .7s cubic-bezier(.22,1,.36,1);}
  @keyframes kpiPulso{0%{box-shadow:var(--shadow), 0 0 0 0 color-mix(in oklch, var(--blue) 55%, transparent);}100%{box-shadow:var(--shadow), 0 0 0 16px color-mix(in oklch, var(--blue) 0%, transparent);}}
  .kpi-bar{position:absolute; left:0; top:15px; bottom:15px; width:3px; border-radius:0 3px 3px 0;}
  .kpi-label{font:700 10px/1 Barlow; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .kpi-value{font-family:"JetBrains Mono",monospace; font-weight:700; font-size:23px; letter-spacing:-.02em; transition:color .3s ease;}
  .kpi-sub{font-size:11.5px; line-height:1.45; color:var(--ink2);}
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1);}
  .reveal.in-view{opacity:1; transform:translateY(0);}
  .info-dot{width:13px; height:13px; border-radius:50%; border:1px solid var(--line2); color:var(--muted); font-size:9.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; cursor:default; position:relative;}
  .info-dot .tip{display:none; position:absolute; bottom:19px; left:50%; transform:translateX(-50%); width:230px; background:var(--ink); color:var(--bg); font-size:11px; font-weight:500; line-height:1.4; padding:8px 10px; border-radius:8px; text-transform:none; letter-spacing:0; z-index:9; box-shadow:var(--shadow);}
  .info-dot:hover .tip, .info-dot:focus .tip{display:block;}

  section.card{border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); padding:22px 24px; transition:border-color .2s ease;}
  section.card:hover{border-color:var(--line2);}
  .card-title{font-size:16.5px; font-weight:700;}
  .card-note{font-size:12.5px; color:var(--muted); margin:5px 0 0;}
  .row-2col{display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:18px;}

  /* donut */
  .donut-wrap{display:flex; align-items:center; gap:24px; flex-wrap:wrap; margin-top:14px;}
  .donut-svg-box{position:relative; width:150px; height:150px; flex:0 0 auto;}
  .donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-pct{font-family:"JetBrains Mono",monospace; font-weight:700; font-size:26px; letter-spacing:-.02em;}
  .donut-pct-label{font:700 9px/1 Barlow; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-top:4px;}
  .donut-legend{flex:1 1 150px; min-width:140px; display:flex; flex-direction:column; gap:11px;}
  .legend-row{display:flex; align-items:center; gap:9px; font-size:13px;}
  .legend-swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
  .legend-row .lbl{color:var(--ink2);}
  .legend-row .val{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700;}
  .donut-reading{margin:6px 0 0; font-size:12px; line-height:1.5; color:var(--muted);}

  /* ranking em barras */
  .rank{display:flex; flex-direction:column; gap:9px; margin-top:16px;}
  .rank-row{display:grid; grid-template-columns:minmax(120px,26%) 1fr auto; gap:12px; align-items:center; font-size:12.5px; border-radius:8px; transition:transform .15s ease, background .15s ease; padding:2px 4px; margin:-2px -4px;}
  .rank-row:hover{transform:translateX(3px); background:var(--surface2);}
  .rank-nome{color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-trilho{height:14px; background:var(--surface3); border-radius:4px; overflow:hidden; display:flex;}
  .rank-barra{height:100%; border-radius:0 4px 4px 0; transition:width .8s cubic-bezier(.22,1,.36,1), filter .15s ease;}
  .rank-row:hover .rank-barra{filter:brightness(1.18);}
  .rank-val{font-family:"JetBrains Mono",monospace; font-size:12.5px; font-weight:700; text-align:right; white-space:nowrap;}

  /* grafico de colunas */
  .chart-box{margin-top:16px; width:100%; overflow-x:auto;}
  .chart-box svg{display:block;}
  .chart-box svg rect{transition:height .7s cubic-bezier(.22,1,.36,1), y .7s cubic-bezier(.22,1,.36,1);}
  .chart-box svg rect:hover{filter:brightness(1.15);}
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--ink2);}
  .chart-legend span.key{display:inline-flex; align-items:center; gap:7px;}
  .chart-legend i{width:14px; height:3px; border-radius:2px; display:inline-block;}
  .chart-legend i.sq{width:11px; height:11px; border-radius:3px;}

  /* tabelas */
  .table-scroll{overflow-x:auto; margin-top:14px; border:1px solid var(--line); border-radius:14px;}
  table.dados{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.dados thead th{position:sticky; top:0; text-align:left; font:700 10px Barlow; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:11px 12px; border-bottom:1px solid var(--line); background:var(--surface2); white-space:nowrap; cursor:pointer; user-select:none;}
  table.dados thead th.num{text-align:right;}
  table.dados thead th:hover{color:var(--ink);}
  table.dados thead th .arrow{opacity:.4; margin-left:3px; font-size:10px;}
  table.dados thead th.sorted .arrow{opacity:1; color:var(--blue);}
  table.dados tbody td{padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.dados tbody td.num{text-align:right; font-family:"JetBrains Mono",monospace; font-size:12.5px; font-weight:600;}
  table.dados tbody tr:nth-child(even){background:color-mix(in oklch, var(--surface2) 55%, transparent);}
  table.dados tbody tr:hover{background:var(--surface3);}
  td.trunc{max-width:280px; overflow:hidden; text-overflow:ellipsis;}
  td.mono-muted{font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600; color:var(--muted);}
  table.dados mark{background:var(--gold); color:#241900; padding:0 2px; border-radius:3px; font-weight:700;}
  .pill{font:700 10.5px Barlow; letter-spacing:.06em; padding:3px 8px; border-radius:100px; white-space:nowrap; display:inline-block;}
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.warn{background:var(--warn-soft); color:var(--warn);}
  .pill.crit{background:var(--crit-soft); color:var(--crit);}
  .pill.neutro{background:var(--muted-soft); color:var(--ink2);}
  .table-footer{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px;}
  .table-footer .info{font-size:12.5px; color:var(--ink2);}
  .pager{display:flex; gap:6px;}
  .pager button{cursor:pointer; border:1px solid var(--line); background:var(--surface2); color:var(--ink); font:600 12px "JetBrains Mono",monospace; padding:7px 13px; border-radius:9px;}
  .pager button:hover:not(:disabled){border-color:var(--line2);}
  .pager button:disabled{opacity:.35; cursor:default; color:var(--muted);}

  details.notas summary{cursor:pointer; font-size:16.5px; font-weight:700; font-family:"Bricolage Grotesque",sans-serif; list-style:none; display:flex; align-items:center; gap:8px;}
  details.notas summary::-webkit-details-marker{display:none;}
  details.notas summary::before{content:"›"; display:inline-block; font-size:18px; color:var(--gold); transition:transform .15s;}
  details.notas[open] summary::before{transform:rotate(90deg);}
  details.notas ul{margin:14px 0 0; padding-left:18px; font-size:12.5px; color:var(--ink2); line-height:1.65;}
  details.notas li{margin-bottom:8px;}
  details.notas code{background:var(--surface2); padding:1px 5px; border-radius:4px; font-size:11.5px; font-family:"JetBrains Mono",monospace; color:var(--ink);}
  details.notas strong{color:var(--ink);}
  .foot-meta{margin-top:6px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
</style>
<style>
  #carregando{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; background:var(--bg); z-index:100; text-align:center; padding:24px;}
  #carregando .marca{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:20px; color:var(--ink);}
  #carregando .dizer{font-size:13.5px; color:var(--ink2); max-width:46ch; line-height:1.6;}
  #carregando .barra{width:220px; height:4px; border-radius:100px; background:var(--surface3); overflow:hidden;}
  #carregando .barra i{display:block; height:100%; width:40%; border-radius:100px; background:var(--blue);
    animation:vaiEVem 1.15s ease-in-out infinite;}
  @keyframes vaiEVem{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
  #carregando.falhou .barra{display:none;}
  #carregando .erro{border:1px solid var(--crit); background:var(--crit-soft); color:var(--ink);
    border-radius:14px; padding:16px 18px; max-width:62ch; font-size:13px; line-height:1.6; text-align:left;}
  #carregando .erro code{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink2);
    display:block; margin-top:10px; word-break:break-word;}
  #raiz[hidden]{display:none;}
</style>

</head>
<body>

<div id="carregando">
  <div class="marca">Central Compras</div>
  <div class="barra"><i></i></div>
  <div class="dizer" id="carregandoTexto">Lendo o DATA WAREHOUSE…</div>
</div>
<div id="raiz" data-theme="dark" style="min-height:100vh;">
  <header>
    <div class="header-top">
      <div class="brand">
        <div class="logo-badge"><img src="logo-lube.png" alt="Lube Distribuidora"></div>
        <div class="brand-div"></div>
        <div>
          <div class="brand-eyebrow">Business Intelligence</div>
          <div class="brand-title">Central Compras</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="sync-pill">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span class="txt">Última carga <strong id="lastSync">—</strong></span>
        </div>
        <div class="source-badge">Compras · WinThor/Oracle</div>
        <div class="theme-toggle" role="group" aria-label="Tema">
          <button type="button" data-theme-btn="dark" class="active">Escuro</button>
          <button type="button" data-theme-btn="light">Claro</button>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="wrap"><main id="main"></main></div>
</div>

<script>
function iniciarPainel(){

"use strict";

var D = window.BI || {};
var COMPRADORES = D.compradores || {};
var FORNEC = D.fornecedores || {};

/* ---------------- formatadores ---------------- */
var fInt = function(n){ return Math.round(n||0).toLocaleString("pt-BR"); };
var fNum = function(n,d){ return (n==null) ? "—" : Number(n).toLocaleString("pt-BR",{maximumFractionDigits:d==null?2:d}); };
var fR$  = function(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); };
var fR$2 = function(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); };
var fPct = function(n){ return (n==null) ? "—" : (n*100).toLocaleString("pt-BR",{maximumFractionDigits:1,minimumFractionDigits:1})+"%"; };
function fCurto(n){
  var a = Math.abs(n||0);
  if(a >= 1e9) return "R$ "+ (n/1e9).toLocaleString("pt-BR",{maximumFractionDigits:2}) +" bi";
  if(a >= 1e6) return "R$ "+ (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) +" mi";
  if(a >= 1e3) return "R$ "+ (n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) +" mil";
  return fR$(n);
}
var MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function rotuloMes(m){ var p=m.split("-"); return MESES[+p[1]-1]+"/"+p[0].slice(2); }
function nomeComprador(c){ return COMPRADORES[c] || COMPRADORES[String(c)] || "—"; }
/* Nome curto para os chips: usa só o primeiro nome, mas quando dois
   compradores têm o mesmo primeiro nome acrescenta a inicial do sobrenome
   (ex.: SERGIO F. e SERGIO B.) para não ficarem indistinguíveis. */
var CURTO = (function(){
  var contagem = {}, mapa = {};
  Object.keys(COMPRADORES).forEach(function(k){
    var p = String(COMPRADORES[k]).trim().split(/\s+/)[0];
    contagem[p] = (contagem[p]||0) + 1;
  });
  Object.keys(COMPRADORES).forEach(function(k){
    var partes = String(COMPRADORES[k]).trim().split(/\s+/);
    mapa[k] = contagem[partes[0]] > 1 && partes[1]
      ? partes[0] + " " + partes[1].charAt(0) + "."
      : partes[0];
  });
  return mapa;
})();
function nomeCurto(cod){ return CURTO[cod] || CURTO[String(cod)] || "—"; }
function primeiroNome(s){ return String(s||"").trim().split(/\s+/)[0]; }
function nomeFornec(c){ var f = FORNEC[c] || FORNEC[String(c)]; return f ? f[0] : "—"; }

/* ---------------- reacoes visuais (numeros animados, revelar ao rolar) ---------------- */
var semMovimento = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var revealObs = (!semMovimento && "IntersectionObserver" in window) ? new IntersectionObserver(function(entradas){
  entradas.forEach(function(en){
    if(!en.isIntersecting) return;
    var t = en.target;
    t.classList.add("in-view");
    revealObs.unobserve(t);
    /* assim que a entrada termina, tira as classes de revelacao — o
       elemento volta a usar so a transicao de hover propria dele
       (ex.: .kpi, .rank-row), sem a transicao mais longa do reveal
       ficar competindo com o hover depois disso. */
    t.addEventListener("transitionend", function limpar(ev){
      if(ev.target!==t || ev.propertyName!=="opacity") return;
      t.classList.remove("reveal","in-view");
      t.style.transitionDelay = "";
      t.removeEventListener("transitionend", limpar);
    });
  });
}, {threshold:.12, rootMargin:"0px 0px -40px 0px"}) : null;
function revelar(elemento, atraso){
  elemento.classList.add("reveal");
  if(atraso) elemento.style.transitionDelay = atraso+"ms";
  if(revealObs) revealObs.observe(elemento); else elemento.classList.add("in-view");
}

/* Le um texto ja formatado (ex.: "R$ 12,3 mi", "45,2%", "1.204") e devolve
   prefixo/sufixo literais + a grandeza numerica real (desfazendo mi/bi/mil),
   para animar o valor de um KPI sem que cada pagina precise expor o numero cru. */
function lerNumeroFormatado(txt){
  if(txt == null) return null;
  var s = String(txt);
  var m = s.match(/^(.*?)(-?\d[\d.,]*)(.*)$/);
  if(!m) return null;
  var prefixo = m[1], bruto = m[2], sufixo = m[3];
  var iVirg = bruto.lastIndexOf(",");
  var casas = iVirg===-1 ? 0 : (bruto.length-iVirg-1);
  var norm = bruto.replace(/\./g,"").replace(",",".");
  var v = parseFloat(norm);
  if(isNaN(v)) return null;
  var abreviado = /\b(mi|bi|mil)\b/.test(sufixo);
  var mult = /\bbi\b/.test(sufixo) ? 1e9 : /\bmi\b/.test(sufixo) ? 1e6 : /\bmil\b/.test(sufixo) ? 1e3 : 1;
  return {prefixo:prefixo, sufixo:sufixo, casas:casas, abreviado:abreviado, grandeza:v*mult, texto:s};
}
function fmtCasas(n,casas){ return n.toLocaleString("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas}); }
function reabreviarGrandeza(n){
  var a = Math.abs(n);
  if(a>=1e9) return fmtCasas(n/1e9,2)+" bi";
  if(a>=1e6) return fmtCasas(n/1e6,1)+" mi";
  if(a>=1e3) return fmtCasas(n/1e3,0)+" mil";
  return fmtCasas(n,0);
}
/* Anima a troca de valor de um .kpi-value entre dois textos formatados. Quando
   nao consegue interpretar algum dos dois (ex.: "—") ou o usuario pediu menos
   movimento, apenas troca o texto na hora. */
function animarKpiValor(elVal, anterior, novoTexto){
  var alvo = lerNumeroFormatado(novoTexto);
  if(!alvo || !anterior || anterior.grandeza==null || semMovimento || anterior.texto===novoTexto){
    elVal.textContent = novoTexto;
    return alvo;
  }
  var de = anterior.grandeza, para = alvo.grandeza;
  var t0 = null, dur = 650;
  function passo(agora){
    if(t0==null) t0 = agora;
    var p = Math.min(1, (agora-t0)/dur);
    var facil = 1-Math.pow(1-p,3);
    var atual = de + (para-de)*facil;
    if(alvo.abreviado || anterior.abreviado){
      elVal.textContent = alvo.prefixo.replace(/\s+$/,"") + " " + reabreviarGrandeza(atual);
    } else {
      elVal.textContent = alvo.prefixo + fmtCasas(atual, alvo.casas) + alvo.sufixo;
    }
    if(p<1) requestAnimationFrame(passo); else elVal.textContent = novoTexto;
  }
  requestAnimationFrame(passo);
  return alvo;
}

/* KPIs */
function montarKpis(destino, defs){
  var anteriores = destino.__kpiAnteriores || [];
  destino.innerHTML = "";
  var atuais = [];
  defs.forEach(function(d,i){
    var t = el("div","kpi");
    var barra = el("div","kpi-bar"); barra.style.background = cor(d.cor||"ink");
    var lab = el("div","kpi-label"); lab.appendChild(document.createTextNode(d.label));
    if(d.info){
      var dot = el("span","info-dot","i"); dot.tabIndex = 0;
      var tip = el("span","tip", d.info); dot.appendChild(tip); lab.appendChild(dot);
    }
    var val = el("div","kpi-value"); val.style.color = cor(d.cor||"ink");
    var infoAnterior = anteriores[i];
    var lido = animarKpiValor(val, infoAnterior, d.valor);
    if(infoAnterior && infoAnterior.texto !== d.valor) t.classList.add("mudou");
    atuais.push(lido);
    var sub = el("div","kpi-sub", d.sub||"");
    t.appendChild(barra); t.appendChild(lab); t.appendChild(val); t.appendChild(sub);
    destino.appendChild(t);
  });
  destino.__kpiAnteriores = atuais;
}

/* ranking horizontal */
function montarRanking(destino, itens, opts){
  opts = opts || {};
  destino.innerHTML = "";
  var max = itens.reduce(function(m,i){ return Math.max(m, Math.abs(i.valor)||0); }, 0) || 1;
  var barras = [];
  itens.forEach(function(i){
    var linha = el("div","rank-row");
    linha.appendChild(el("div","rank-nome", i.nome));
    var trilho = el("div","rank-trilho");
    var barra = el("div","rank-barra");
    var alvo = Math.max(1.5, Math.abs(i.valor)/max*100) + "%";
    barra.style.width = semMovimento ? alvo : "0%";
    barra.style.background = cor(i.cor || opts.cor || "blue");
    trilho.appendChild(barra);
    linha.appendChild(trilho);
    linha.appendChild(el("div","rank-val", i.rotulo));
    destino.appendChild(linha);
    if(!semMovimento) barras.push([barra, alvo]);
  });
  if(barras.length){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      barras.forEach(function(b){ b[0].style.width = b[1]; });
    }); });
  }
}

/* donut */
function montarDonut(caixa, partes, leitura){
  caixa.innerHTML = "";
  var total = partes.reduce(function(s,p){ return s+(p.valor||0); },0) || 1;
  var env = el("div","donut-wrap");
  var box = el("div","donut-svg-box");
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 150 150");
  svg.style.cssText = "width:100%;height:100%;transform:rotate(-90deg);";
  var r=60, circ=2*Math.PI*r, offset=0;
  var fundo = document.createElementNS(ns,"circle");
  fundo.setAttribute("cx",75); fundo.setAttribute("cy",75); fundo.setAttribute("r",r);
  fundo.setAttribute("fill","none"); fundo.setAttribute("stroke","var(--surface3)"); fundo.setAttribute("stroke-width",18);
  svg.appendChild(fundo);
  var segs = [];
  partes.forEach(function(p){
    var len = circ*((p.valor||0)/total);
    var seg = document.createElementNS(ns,"circle");
    seg.setAttribute("cx",75); seg.setAttribute("cy",75); seg.setAttribute("r",r);
    seg.setAttribute("fill","none"); seg.setAttribute("stroke",cor(p.cor)); seg.setAttribute("stroke-width",18);
    seg.setAttribute("stroke-linecap","round");
    var alvo = Math.max(len-2,0)+" "+(circ-len+2);
    seg.setAttribute("stroke-dasharray", semMovimento ? alvo : ("0 "+circ));
    seg.setAttribute("stroke-dashoffset", -offset);
    seg.style.transition = "stroke-dasharray .9s cubic-bezier(.22,1,.36,1)";
    svg.appendChild(seg);
    if(!semMovimento) segs.push([seg, alvo]);
    offset += len;
  });
  if(segs.length){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      segs.forEach(function(s){ s[0].setAttribute("stroke-dasharray", s[1]); });
    }); });
  }
  box.appendChild(svg);
  var centro = el("div","donut-center");
  var pct = el("span","donut-pct num", fPct((partes[0].valor||0)/total));
  pct.style.color = cor(partes[0].cor);
  centro.appendChild(pct);
  centro.appendChild(el("span","donut-pct-label", partes[0].label.toUpperCase()));
  box.appendChild(centro);
  env.appendChild(box);

  var leg = el("div","donut-legend");
  partes.forEach(function(p){
    var l = el("div","legend-row");
    var sw = el("span","legend-swatch"); sw.style.background = cor(p.cor);
    l.appendChild(sw);
    l.appendChild(el("span","lbl", p.label));
    l.appendChild(el("span","val num", fInt(p.valor)+" ("+fPct((p.valor||0)/total)+")"));
    leg.appendChild(l);
  });
  if(leitura) leg.appendChild(el("p","donut-reading", leitura));
  env.appendChild(leg);
  caixa.appendChild(env);
}

/* grafico de colunas com linha opcional */
function montarColunas(caixa, dados, opts){
  opts = opts || {};
  caixa.innerHTML = "";
  if(!dados.length) return;
  var larguraCol = opts.larguraCol || 26;
  var L = Math.max(640, dados.length*larguraCol + 90);
  var A = opts.altura || 260;
  var mostrarValores = dados.length <= 16;
  var mE = 64, mD = opts.linha ? 52 : 14, mT = mostrarValores ? 32 : 16, mB = 34;
  var pw = L-mE-mD, ph = A-mT-mB;
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 "+L+" "+A);
  svg.setAttribute("width", L); svg.setAttribute("height", A);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label", opts.aria || "Gráfico de colunas");

  function cria(t, attrs){
    var e = document.createElementNS(ns,t);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  var maxV = Math.max.apply(null, dados.map(function(d){ return d.valor||0; })) || 1;
  var passos = 4, escala = Math.pow(10, Math.floor(Math.log10(maxV/passos)));
  var passo = Math.ceil(maxV/passos/escala)*escala;
  var topo = passo*passos;

  for(var i=0;i<=passos;i++){
    var y = mT + ph - (i*passo/topo)*ph;
    svg.appendChild(cria("line",{x1:mE,y1:y,x2:mE+pw,y2:y,stroke:"var(--grid)","stroke-width":1}));
    var tx = cria("text",{x:mE-8,y:y+4,"text-anchor":"end","font-size":10.5,"font-weight":700,fill:"var(--muted)","font-family":"JetBrains Mono, monospace"});
    tx.textContent = opts.eixoFmt ? opts.eixoFmt(i*passo) : fInt(i*passo);
    svg.appendChild(tx);
  }

  var bw = Math.min(24, pw/dados.length*0.62);
  var crescer = [];
  var rotulosValor = [];
  dados.forEach(function(d,i){
    var cx = mE + (i+0.5)*(pw/dados.length);
    var h = Math.max(1, ((d.valor||0)/topo)*ph);
    var y = mT + ph - h;
    var yBase = mT+ph, hBase = Math.min(h,4);
    var g = cria("g",{});
    var barra = cria("rect",{x:cx-bw/2, y: semMovimento?y:yBase, width:bw, height: semMovimento?h:0, rx:4, fill: cor(d.cor||opts.cor||"blue")});
    barra.appendChild(cria("title",{})).textContent = d.rotulo + ": " + (opts.valorFmt ? opts.valorFmt(d.valor) : fInt(d.valor));
    g.appendChild(barra);
    // canto inferior reto
    var cantoY = mT+ph-hBase;
    var canto = cria("rect",{x:cx-bw/2, y: semMovimento?cantoY:yBase, width:bw, height: semMovimento?hBase:0, fill:cor(d.cor||opts.cor||"blue")});
    g.appendChild(canto);
    svg.appendChild(g);
    if(!semMovimento){ crescer.push([barra,y,h],[canto,cantoY,hBase]); }
    if(mostrarValores && (d.valor||0) > 0){
      var val = cria("text",{x:cx, y:y-8,"text-anchor":"middle","font-size":10.5,"font-weight":700,
        fill:"var(--ink)","font-family":"JetBrains Mono, monospace"});
      val.textContent = opts.valorFmt ? opts.valorFmt(d.valor) : fInt(d.valor);
      val.style.opacity = semMovimento ? 1 : 0;
      val.style.transition = "opacity .35s ease";
      svg.appendChild(val);
      if(!semMovimento) rotulosValor.push(val);
    }
    if(dados.length <= 40 || i % Math.ceil(dados.length/24) === 0){
      var lb = cria("text",{x:cx, y:A-12,"text-anchor":"middle","font-size":9.5,"font-weight":600,fill:"var(--muted)"});
      lb.textContent = d.rotulo;
      svg.appendChild(lb);
    }
  });
  if(crescer.length){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      crescer.forEach(function(c){ c[0].setAttribute("y",c[1]); c[0].setAttribute("height",c[2]); });
    }); });
  }
  if(rotulosValor.length){
    setTimeout(function(){ rotulosValor.forEach(function(t){ t.style.opacity = 1; }); }, 560);
  }

  if(opts.linha){
    var maxL = Math.max.apply(null, opts.linha.map(function(v){ return v==null?0:v; })) || 1;
    var minL = Math.min.apply(null, opts.linha.map(function(v){ return v==null?maxL:v; }));
    var faixa = (maxL-minL) || 1;
    var pts = [];
    opts.linha.forEach(function(v,i){
      if(v==null) return;
      var cx = mE + (i+0.5)*(pw/dados.length);
      var y = mT + ph - ((v-minL)/faixa)*ph*0.82 - ph*0.09;
      pts.push([cx,y]);
    });
    if(pts.length){
      svg.appendChild(cria("polyline",{points:pts.map(function(p){return p.join(",");}).join(" "),
        fill:"none", stroke:cor(opts.linhaCor||"gold"), "stroke-width":2,
        "stroke-linejoin":"round","stroke-linecap":"round"}));
      var ult = pts[pts.length-1];
      svg.appendChild(cria("circle",{cx:ult[0],cy:ult[1],r:4,fill:cor(opts.linhaCor||"gold"),
        stroke:"var(--bg)","stroke-width":2}));
      var rot = cria("text",{x:Math.min(ult[0]+9,L-4), y:ult[1]+4,"font-size":11,
        fill:"var(--ink)","font-family":"JetBrains Mono, monospace","font-weight":600});
      rot.textContent = opts.linhaFmt ? opts.linhaFmt(opts.linha[opts.linha.length-1]) : "";
      svg.appendChild(rot);
    }
  }
  caixa.appendChild(svg);
}

/* tabela reutilizavel com ordenacao e paginacao */
function Tabela(destino, cfg){
  this.destino = destino;
  this.cfg = cfg;
  this.ordem = cfg.ordemInicial || cfg.colunas[0].campo;
  this.dir = cfg.dirInicial || -1;
  this.pagina = 1;
  this.tam = cfg.porPagina || 40;
  this.linhas = [];
}
Tabela.prototype.definir = function(linhas, termo){ this.linhas = linhas; this.termo = termo||""; this.pagina = 1; this.desenhar(); };
/* escreve texto num <td> destacando o trecho que bateu com a busca, sem usar innerHTML */
function escreverComDestaque(container, texto, termo){
  var s = texto==null ? "" : String(texto);
  if(!termo){ container.textContent = s; return; }
  var baixo = s.toLowerCase(), t = termo.toLowerCase(), pos = 0, i = baixo.indexOf(t);
  if(i===-1){ container.textContent = s; return; }
  while(i!==-1){
    if(i>pos) container.appendChild(document.createTextNode(s.slice(pos,i)));
    var mk = document.createElement("mark");
    mk.textContent = s.slice(i, i+termo.length);
    container.appendChild(mk);
    pos = i+termo.length;
    i = baixo.indexOf(t,pos);
  }
  if(pos<s.length) container.appendChild(document.createTextNode(s.slice(pos)));
}
Tabela.prototype.desenhar = function(){
  var self = this, cfg = this.cfg;
  var ordenadas = this.linhas.slice().sort(function(a,b){
    var av = a[self.ordem], bv = b[self.ordem];
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    if(typeof av === "string") return av.localeCompare(bv,"pt-BR")*self.dir;
    return (av-bv)*self.dir;
  });
  var totalPag = Math.max(1, Math.ceil(ordenadas.length/this.tam));

/* barra de filtro por comprador, reutilizada nas paginas */
function filtroComprador(destino, estado, aoMudar, extras){
  /* a barra inteira e reconstruida a cada render() (inclusive a cada tecla
     digitada na busca); sem isso o campo de busca perderia o foco e o
     cursor a cada letra, porque o <input> antigo e destruido e um novo
     e criado no lugar. */
  var focoAtivo = destino.contains(document.activeElement) ? document.activeElement : null;
  var focoSelIni = focoAtivo && "selectionStart" in focoAtivo ? focoAtivo.selectionStart : null;
  var focoSelFim = focoAtivo && "selectionEnd" in focoAtivo ? focoAtivo.selectionEnd : null;
  destino.innerHTML = "";
  var g = el("div","filter-group");
  g.appendChild(el("span","filter-label","Comprador"));
  var todos = el("button","chip"+(estado.comps.size===COMP_LISTA.length?" on":""),"Todos");
  todos.type="button";
  todos.addEventListener("click", function(){
    estado.comps = new Set(COMP_LISTA.map(function(c){return c.cod;}));
    aoMudar();
  });
  g.appendChild(todos);
  COMP_LISTA.forEach(function(c){
    var b = el("button","chip"+(estado.comps.has(c.cod) && estado.comps.size<COMP_LISTA.length?" on":""), nomeCurto(c.cod));
    b.type="button"; b.title = c.nome;
    b.addEventListener("click", function(){
      estado.comps = new Set([c.cod]);
      aoMudar();
    });
    g.appendChild(b);
  });
  destino.appendChild(g);
  (extras||[]).forEach(function(e){ destino.appendChild(e); });
  if(focoAtivo && focoAtivo.tagName === "INPUT"){
    var novoInput = destino.querySelector("input[type=text]");
    if(novoInput){
      novoInput.focus();
      if(focoSelIni!=null){ try{ novoInput.setSelectionRange(focoSelIni, focoSelFim); }catch(e){} }
    }
  }
}
function grupoChips(rotulo, opcoes, atual, aoEscolher){
  var g = el("div","filter-group");
  g.appendChild(el("span","filter-label",rotulo));
  opcoes.forEach(function(o){
    var b = el("button","chip"+(o.tom?" tone-"+o.tom:"")+(atual===o.valor?" on":""), o.label);
    b.type="button";

}

function agruparPorComprador(lista, valorDe){
  var m = new Map();

    .sort(function(a,b){ return Math.abs(b.valor)-Math.abs(a.valor); });

        {label:"Margem", valor:fPct(totalVenda?totalLucro/totalVenda:0), cor:"gold", sub:"Lucro sobre a venda do período."},
        {label:"Pedidos", valor:fInt(pedidos), cor:"ink", sub:"Total acumulado desde 2021."},
        {label:"Positivação", valor:fInt(posit), cor:"ink", sub:"Clientes distintos atendidos, somados por dia."},
        {label:"Melhor margem", valor:melhor?fPct(use12?melhor.margem12:melhor.margem):"—", cor:"good",
         sub:melhor?nomeComprador(melhor.comp):"—"}
      ]);

      var itens, titulo, nota, corBarra;
      if(estado.corte==="comprador"){
        itens = FATCOMP.map(function(c){ return {nome:nomeComprador(c.comp), valor:use12?c.v12:c.venda}; });
        titulo = "Venda por comprador"; nota = "Cada comprador responde pela carteira de fornecedores sob sua gestão."; corBarra="blue";
      } else if(estado.corte==="fornecedor"){
        itens = FATFORN.slice(0,20).map(function(f){ return {nome:nomeFornec(f.cod), valor:use12?f.v12:f.venda}; });
        titulo = "Top 20 fornecedores"; nota = "Ordenado pela venda do período selecionado."; corBarra="blue";
      } else if(estado.corte==="departamento"){
        itens = FATDEPTO.map(function(d){ return {nome:d.nome, valor:use12?d.v12:d.venda}; });
        titulo = "Venda por departamento"; nota = "Classificação de produto do WinThor."; corBarra="gold";
      } else {
        itens = FATSUP.map(function(s){ return {nome:s.nome, valor:use12?s.v12:s.venda}; });
        titulo = "Venda por supervisor"; nota = "Equipe comercial responsável pelo pedido."; corBarra="gold";
      }
      itens = itens.filter(function(i){ return i.valor>0; }).sort(function(a,b){ return b.valor-a.valor; }).slice(0,20);
      cRank.querySelector(".card-title").textContent = titulo;
      cRank.querySelector(".card-note").textContent = nota;
      montarRanking(boxRank, itens.map(function(i){ return {nome:i.nome, valor:i.valor, rotulo:fCurto(i.valor)}; }), {cor:corBarra});

      tabela.definir(FATCOMP.map(function(c){
        var o = {}; for(var k in c) o[k]=c[k];
        o.nome = nomeComprador(c.comp);
        return o;
      }));
    }
    cRank.insertBefore(el("p","card-note",""), boxRank);
    render();
    return render;
  });

pagina("metricas","07","Métricas","Evolução mensal de venda, lucro e margem",
  "A mesma base de faturamento vista no tempo: venda mês a mês desde janeiro de 2021, com a margem sobrepostada em linha. Use o seletor de período para aproximar. O mês corrente costuma aparecer menor porque ainda está em curso.",
  function(raiz){
    var estado = {janela:"24m", metrica:"venda"};
    var barra = el("div","filters"); raiz.appendChild(barra);
    var kpis = el("div","kpi-grid"); raiz.appendChild(kpis);

    var cEvo = cartao("Evolução mensal","Colunas: valor do mês. Linha dourada: margem do mês, em escala própria.");
    var boxEvo = el("div","chart-box"); cEvo.appendChild(boxEvo);
    var legenda = el("div","chart-legend"); cEvo.appendChild(legenda);
    raiz.appendChild(cEvo);

    var linha = el("div","row-2col"); raiz.appendChild(linha);
    var cDep = cartao("Departamentos","Venda acumulada desde 2021.");
    var boxDep = el("div","rank"); cDep.appendChild(boxDep); linha.appendChild(cDep);
    var cUf = cartao("Estados","Onde a venda acontece.");
    var boxUf = el("div","rank"); cUf.appendChild(boxUf); linha.appendChild(cUf);

    var cSec = cartao("Seções mais vendidas","As 20 maiores seções de produto por venda acumulada.");
    var boxSec = el("div","rank"); cSec.appendChild(boxSec); raiz.appendChild(cSec);

    var cTab = cartao("Mês a mês","");
    var boxTab = el("div"); cTab.appendChild(boxTab); raiz.appendChild(cTab);
    var tabela = new Tabela(boxTab,{
      porPagina:24, ordemInicial:"mes", dirInicial:-1,
      colunas:[
        {titulo:"Mês", campo:"mes", texto:true, fmt:function(v){ return rotuloMes(v); }},
        {titulo:"Venda", campo:"venda", num:true, fmt:fCurto},
        {titulo:"CMV", campo:"cmv", num:true, fmt:fCurto},
        {titulo:"Lucro", campo:"lucro", num:true, fmt:fCurto},
        {titulo:"Margem", campo:"margem", num:true, fmt:fPct,
         corTexto:function(v){ return v==null?"":(v<0.15?cor("crit"):(v>0.25?cor("good"):cor("warn"))); }},
        {titulo:"Pedidos", campo:"pedidos", num:true, fmt:fInt},
        {titulo:"Positivação", campo:"posit", num:true, fmt:fInt}
      ]
    });

    function render(){
      var n = estado.janela==="12m" ? 12 : (estado.janela==="24m" ? 24 : FATMES.length);
      var serie = FATMES.slice(-n);
      var venda = serie.reduce(function(s,m){ return s+(m.venda||0); },0);
      var lucro = serie.reduce(function(s,m){ return s+(m.lucro||0); },0);
      var melhor = serie.slice().sort(function(a,b){ return b.venda-a.venda; })[0];
      var fechados = serie.slice(0,-1);
      var mediaMes = fechados.length ? fechados.reduce(function(s,m){ return s+m.venda; },0)/fechados.length : 0;
      var ultFechado = fechados[fechados.length-1];
      var anterior = fechados[fechados.length-2];
      var variacao = (ultFechado && anterior && anterior.venda) ? (ultFechado.venda/anterior.venda-1) : null;

      barra.innerHTML = "";
      barra.appendChild(grupoChips("Período",[
        {label:"12 meses",valor:"12m"},{label:"24 meses",valor:"24m"},{label:"Desde 2021",valor:"tudo"}
      ], estado.janela, function(v){ estado.janela=v; render(); }));
      barra.appendChild(grupoChips("Colunas",[
        {label:"Venda",valor:"venda"},{label:"Lucro",valor:"lucro"},{label:"Pedidos",valor:"pedidos"}
      ], estado.metrica, function(v){ estado.metrica=v; render(); }));

      montarKpis(kpis,[
        {label:"Venda no período", valor:fCurto(venda), cor:"blue", sub:serie.length+" meses considerados."},
        {label:"Lucro no período", valor:fCurto(lucro), cor:"good", sub:"Venda menos CMV."},
        {label:"Margem do período", valor:fPct(venda?lucro/venda:0), cor:"gold", sub:"Lucro sobre venda."},
        {label:"Média mensal", valor:fCurto(mediaMes), cor:"ink", sub:"Só meses fechados — ignora o mês corrente."},
        {label:"Melhor mês", valor:melhor?fCurto(melhor.venda):"—", cor:"good", sub:melhor?rotuloMes(melhor.mes):"—"},
        {label:"Último mês fechado", valor:ultFechado?fCurto(ultFechado.venda):"—",
         cor: variacao==null ? "ink" : (variacao>=0?"good":"crit"),
         sub: variacao==null ? "—" : ((variacao>=0?"+":"")+fPct(variacao)+" contra o mês anterior")}
      ]);

      var campo = estado.metrica;
      montarColunas(boxEvo, serie.map(function(m){
        return {rotulo:rotuloMes(m.mes), valor:m[campo]||0, cor:"blue"};
      }), {
        altura:300, larguraCol:Math.max(20, Math.min(46, 900/serie.length)),
        linha: serie.map(function(m){ return m.margem; }),
        linhaCor:"gold", linhaFmt:function(v){ return fPct(v); },
        valorFmt: campo==="pedidos" ? fInt : fCurto,
        eixoFmt: campo==="pedidos" ? function(v){ return fInt(v); } : function(v){ return v===0 ? "0" : (v>=1e6 ? (v/1e6).toFixed(0)+" mi" : (v/1e3).toFixed(0)+" mil"); },
        aria:"Evolução mensal"
      });
      legenda.innerHTML = "";
      var k1 = el("span","key"); var i1 = el("i","sq"); i1.style.background=cor("blue");
      k1.appendChild(i1); k1.appendChild(document.createTextNode(campo==="venda"?"Venda do mês":(campo==="lucro"?"Lucro do mês":"Pedidos do mês")));
      var k2 = el("span","key"); var i2 = el("i"); i2.style.background=cor("gold");
      k2.appendChild(i2); k2.appendChild(document.createTextNode("Margem do mês (escala própria)"));
      legenda.appendChild(k1); legenda.appendChild(k2);

      montarRanking(boxDep, FATDEPTO.slice().sort(function(a,b){ return b.venda-a.venda; })
        .map(function(d){ return {nome:d.nome, valor:d.venda, rotulo:fCurto(d.venda)}; }), {cor:"gold"});
      montarRanking(boxUf, FATUF.slice().sort(function(a,b){ return b.venda-a.venda; })
        .map(function(u){ return {nome:u.uf, valor:u.venda, rotulo:fCurto(u.venda)}; }), {cor:"blue"});
      montarRanking(boxSec, FATSEC.slice(0,20)
        .map(function(s){ return {nome:s.nome, valor:s.venda, rotulo:fCurto(s.venda)}; }), {cor:"blue"});

      cTab.querySelector(".card-note") || cTab.insertBefore(el("p","card-note",""), boxTab);
      cTab.querySelector(".card-note").textContent = "Todos os "+FATMES.length+" meses da base, do mais recente para o mais antigo.";
      tabela.definir(FATMES);
    }
    render();
    return render;
  });

pagina("saldo_verba","08","Saldo verba","Crédito disponível com os fornecedores",
  "O saldo de verba por fornecedor principal, sem cruzar com avaria. Entrada é crédito concedido, saída é crédito consumido, e o saldo de movimentação é a diferença — é esse valor que alimenta o cartão de verba da página Compras. As colunas de vencidas e a vencer separam o crédito pelo prazo registrado na verba.",
  function(raiz){
    var estado = {comps:todosComps(), busca:""};
    var barra = el("div","filters"); raiz.appendChild(barra);
    var kpis = el("div","kpi-grid"); raiz.appendChild(kpis);

    var linha = el("div","row-2col"); raiz.appendChild(linha);
    var cRank = cartao("Maiores saldos","Os 15 fornecedores com mais crédito disponível.");
    var boxRank = el("div","rank"); cRank.appendChild(boxRank); linha.appendChild(cRank);
    var cPrazo = cartao("Crédito por prazo","Quanto do saldo já venceu e quanto ainda está no prazo.");
    var boxPrazo = el("div"); cPrazo.appendChild(boxPrazo); linha.appendChild(cPrazo);

    var cTab = cartao("Todos os fornecedores","");
    var boxTab = el("div"); cTab.appendChild(boxTab); raiz.appendChild(cTab);
    var tabela = new Tabela(boxTab,{
      porPagina:40, ordemInicial:"verba", dirInicial:-1,
      colunas:[
        {titulo:"Código", campo:"cod", num:true, classe:"mono-muted"},
        {titulo:"Fornecedor principal", campo:"nome", classe:"trunc", texto:true},
        {titulo:"Comprador", campo:"comp", texto:true, fmt:function(v){ return v==null?"—":nomeComprador(v); }},
        {titulo:"Entrada", campo:"entrada", num:true, fmt:fR$2},
        {titulo:"Saída", campo:"saida", num:true, fmt:fR$2, corTexto:function(){ return cor("muted"); }},
        {titulo:"Saldo mov.", campo:"verba", num:true, fmt:fR$2,
         corTexto:function(v){ return v>=0?cor("good"):cor("crit"); }},
        {titulo:"Vencidas", campo:"vencidas", num:true, fmt:fR$2},
        {titulo:"A vencer", campo:"avencer", num:true, fmt:fR$2}
      ]
    });

    function render(){
      var lista = VERBA.filter(function(v){
        if(estado.comps.size < COMP_LISTA.length && !estado.comps.has(v.comp)) return false;
        if(estado.busca && String(v.nome).toLowerCase().indexOf(estado.busca)===-1
           && String(v.cod).indexOf(estado.busca)===-1) return false;
        return true;
      });
      var saldo = lista.reduce(function(s,v){ return s+(v.verba||0); },0);
      var entrada = lista.reduce(function(s,v){ return s+(v.entrada||0); },0);
      var saida = lista.reduce(function(s,v){ return s+Math.abs(v.saida||0); },0);
      var vencidas = lista.reduce(function(s,v){ return s+(v.vencidas||0); },0);
      var avencer = lista.reduce(function(s,v){ return s+(v.avencer||0); },0);
      var comSaldo = lista.filter(function(v){ return (v.verba||0) > 0; });

      filtroComprador(barra, estado, function(){ render(); }, [
        blocoBusca(estado.busca, function(v){ estado.busca=v; render(); },
          function(){ estado={comps:todosComps(),busca:""}; render(); })
      ]);

      montarKpis(kpis,[
        {label:"Saldo de verba", valor:fR$(saldo), cor:"good", sub:"Entrada menos saída de crédito."},
        {label:"Crédito concedido", valor:fR$(entrada), cor:"blue", sub:"Total lançado a favor da empresa."},
        {label:"Crédito consumido", valor:fR$(saida), cor:"muted", sub:"Já utilizado em abatimentos."},
        {label:"Fornecedores com saldo", valor:fInt(comSaldo.length), cor:"ink",
         sub:"De "+fInt(lista.length)+" no filtro atual."},
        {label:"Vencidas", valor:fR$(vencidas), cor:"warn", sub:"Verba com vencimento já passado."},
        {label:"A vencer", valor:fR$(avencer), cor:"good", sub:"Ainda dentro do prazo."}
      ]);

      montarRanking(boxRank, lista.slice().sort(function(a,b){ return b.verba-a.verba; }).slice(0,15)
        .map(function(v){ return {nome:v.nome, valor:v.verba, rotulo:fR$(v.verba)}; }), {cor:"good"});

      montarDonut(boxPrazo,[
        {label:"Vencidas", valor:Math.max(0,vencidas), cor:"warn"},
        {label:"A vencer", valor:Math.max(0,avencer), cor:"good"}
      ], (vencidas+avencer) ? ("Do crédito com prazo registrado, "+fPct(vencidas/(vencidas+avencer))+" já passou do vencimento.") : "Sem prazo registrado no filtro atual.");

      cTab.querySelector(".card-note") || cTab.insertBefore(el("p","card-note",""), boxTab);
      cTab.querySelector(".card-note").textContent = "Base completa: "+fInt(VERBA.length)+" fornecedores principais.";
      tabela.definir(lista, estado.busca);
    }
    render();
    return render;
  });

function blocoNotas(){
  var d = document.createElement("details");
  d.className = "card notas"; d.open = false;
  var s = document.createElement("summary"); s.textContent = "Notas técnicas desta versão";
  d.appendChild(s);
  var ul = document.createElement("ul");
  [
   "<strong>Origem:</strong> todas as páginas leem o projeto DATA WAREHOUSE no Supabase, alimentado a partir do Oracle/WinThor. As consultas rápidas rodam 4x ao dia; o faturamento, 1x por dia de madrugada.",
   "<strong>Verba:</strong> o cartão de verba da página Compras agora usa a consulta oficial de saldo de verba (Consulta3/SALDOMOV). Nas primeiras versões deste painel ele somava a coluna de verba da própria consulta de ruptura, que é por fornecedor principal — o valor saía cerca do dobro do real.",
   "<strong>Status ATIVO/FORALINHA:</strong> a coluna OBS2 do WinThor não distingue os dois valores em todos os produtos. Até corrigirmos a origem, quem não é explicitamente FORALINHA é tratado como ativo.",
   "<strong>Avaria:</strong> na página Compras ela considera as filiais 1, 2, 7 e 8. Na página Saldo verba x avaria ela soma todas as filiais, porque o filtro de filial dessa consulta de origem nunca chega a ser aplicado.",
   "<strong>Sugestão por fornecedor:</strong> cada produto da carteira do fornecedor é avaliado ao seu próprio preço de venda, e a sugestão soma o valor de cada item individualmente.",
   "<strong>Margem do faturamento:</strong> a divisão é protegida contra venda zero, evitando distorções no cálculo quando não há venda no período.",
   "<strong>Atualização:</strong> esta página guarda uma fotografia dos dados do momento em que foi publicada. Os números do banco continuam sendo atualizados pelo pipeline; peça uma republicação quando quiser a foto mais recente."
  ].forEach(function(t){ var li = document.createElement("li"); li.innerHTML = t; ul.appendChild(li); });
  d.appendChild(ul);
  return d;
}

function abrir(id){
  PAGINAS.forEach(function(pg){
    var e = pg.id === id;
    pg.botao.classList.toggle("active", e);
    pg.container.classList.toggle("ativa", e);
    if(e && !pg.pronta){
      pg.container.appendChild(cabecalho(pg));
      renders[pg.id] = pg.montar(pg.container);
      pg.pronta = true;
      /* revela em blocos (cartoes, barra de filtro) e, dentro de cada
         grade de KPI/ranking, revela cada numero individualmente — assim
         os dados aparecem aos poucos conforme a pagina rola pra dentro
         da tela, em vez de tudo de uma vez. */
      Array.prototype.forEach.call(pg.container.children, function(filho, i){
        if(filho.classList.contains("kpi-grid")){
          Array.prototype.forEach.call(filho.children, function(kpi, j){
            revelar(kpi, Math.min(j*45, 380));
          });
        } else {
          revelar(filho, Math.min(i*70, 420));
          Array.prototype.forEach.call(filho.querySelectorAll(".rank-row"), function(linha, j){
            revelar(linha, Math.min(j*35, 350));
          });
        }
      });
    }
  });
  ativa = id;
  try{ localStorage.setItem("bi_aba", id); }catch(e){}
  window.scrollTo({top:0, behavior:"smooth"});
}
function redesenhar(){ if(ativa && renders[ativa]) renders[ativa](); }

var temaSalvo = "dark";
try{ temaSalvo = localStorage.getItem("bi_tema") || "dark"; }catch(e){}
document.documentElement.setAttribute("data-theme", temaSalvo==="light" ? "light" : "dark");
raiz.setAttribute("data-theme", temaSalvo==="light" ? "light" : "dark");
document.querySelectorAll("[data-theme-btn]").forEach(function(b){
  b.classList.toggle("active", b.getAttribute("data-theme-btn")===temaSalvo);
});

var abaSalva = null;
try{ abaSalva = localStorage.getItem("bi_aba"); }catch(e){}
abrir(PAGINAS.some(function(p){ return p.id===abaSalva; }) ? abaSalva : "compras");

}

(function(){
  var caixa = document.getElementById("carregando");
  var texto = document.getElementById("carregandoTexto");
  var raiz  = document.getElementById("raiz");
  raiz.hidden = true;

  function falhar(titulo, detalhe){
    caixa.classList.add("falhou");
    texto.textContent = titulo;
    var box = document.createElement("div");
    box.className = "erro";
    box.textContent = detalhe || "";
    caixa.appendChild(box);
  }

  fetch("/api/dados", {headers:{"Accept":"application/json"}})
    .then(function(r){
      return r.json().then(function(corpo){
        if(!r.ok) throw new Error((corpo && corpo.mensagem) || ("HTTP " + r.status));
        return corpo;
      }, function(){ throw new Error("A resposta do servidor não veio em JSON (HTTP " + r.status + ")."); });
    })
    .then(function(dados){
      window.BI = dados;
      iniciarPainel();
      caixa.remove();
      raiz.hidden = false;
    })
    .catch(function(e){
      falhar("Não consegui carregar os dados.",
             (e && e.message ? e.message : String(e)) +
             "  ·  Se isto acabou de ser publicado, confira as variáveis de ambiente do projeto na Vercel.");
    });
})();
